apiVersion: v1
kind: Service
metadata:
  name: messaging-frontend
spec:
  type: NodePort
  selector:
    app: messaging-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: messaging-frontend
  template:
    metadata:
      labels:
        app: messaging-frontend
    spec:
      containers:
        - name: frontend
          image: messaging-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: messaging-env
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
