services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-${RAZORPAY_KEY_ID:-}}
    mem_limit: 64m
    container_name: messaging-frontend
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"
    depends_on:
      - backend
    networks:
      - messaging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1536m}
    container_name: messaging-backend
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"
    environment:
      SERVER_PORT: ${BACKEND_CONTAINER_PORT}
      SNOWFLAKE_NODE_ID: ${SNOWFLAKE_NODE_ID:?SNOWFLAKE_NODE_ID is required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:${POSTGRES_CONTAINER_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      APP_NOTIFICATION_ASYNC: ${APP_NOTIFICATION_ASYNC:-true}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:5100}
      APP_PUBLIC_API_BASE_URL: ${APP_PUBLIC_API_BASE_URL:-http://localhost:8001}
      APP_RECIPIENT_ACTION_KEY: ${APP_RECIPIENT_ACTION_KEY:-}
      APP_RECIPIENT_ACTION_TOKEN_TTL: ${APP_RECIPIENT_ACTION_TOKEN_TTL:-365d}
      APP_RECIPIENT_ACTION_CLOCK_SKEW: ${APP_RECIPIENT_ACTION_CLOCK_SKEW:-5m}
      CHANNEL_CREDENTIAL_MASTER_KEY: ${CHANNEL_CREDENTIAL_MASTER_KEY:-}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-superadmin@localhost.test}
      BOOTSTRAP_SUPER_ADMIN_USERNAME: ${BOOTSTRAP_SUPER_ADMIN_USERNAME:-superadmin}
      BOOTSTRAP_SUPER_ADMIN_NAME: ${BOOTSTRAP_SUPER_ADMIN_NAME:-Super Admin}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      APP_BILLING_RAZORPAY_ENABLED: ${APP_BILLING_RAZORPAY_ENABLED:-true}
      APP_BILLING_RAZORPAY_RECURRING_ENABLED: ${APP_BILLING_RAZORPAY_RECURRING_ENABLED:-false}
      APP_BILLING_RAZORPAY_BASE_URL: ${APP_BILLING_RAZORPAY_BASE_URL:-https://api.razorpay.com/v1}
      APP_BILLING_RAZORPAY_KEY_ID: ${APP_BILLING_RAZORPAY_KEY_ID:-${RAZORPAY_KEY_ID:-}}
      APP_BILLING_RAZORPAY_KEY_SECRET: ${APP_BILLING_RAZORPAY_KEY_SECRET:-${RAZORPAY_KEY_SECRET:-}}
      APP_BILLING_RAZORPAY_WEBHOOK_SECRET: ${APP_BILLING_RAZORPAY_WEBHOOK_SECRET:-${RAZORPAY_WEBHOOK_SECRET:-}}
      APP_BILLING_RAZORPAY_RETURN_URL: ${APP_BILLING_RAZORPAY_RETURN_URL:-http://localhost:5100/billing}
      APP_BILLING_RAZORPAY_NOTIFY_URL: ${APP_BILLING_RAZORPAY_NOTIFY_URL:-http://localhost:8001/api/v1/webhooks/razorpay}
      APP_BILLING_RAZORPAY_RECONCILIATION_INTERVAL_MS: ${APP_BILLING_RAZORPAY_RECONCILIATION_INTERVAL_MS:-300000}
      APP_BILLING_RAZORPAY_RECONCILIATION_INITIAL_DELAY_MS: ${APP_BILLING_RAZORPAY_RECONCILIATION_INITIAL_DELAY_MS:-60000}
      APP_BILLING_RAZORPAY_WEBHOOK_MAX_ATTEMPTS: ${APP_BILLING_RAZORPAY_WEBHOOK_MAX_ATTEMPTS:-8}
      APP_BILLING_RAZORPAY_WEBHOOK_RETRY_BASE_SECONDS: ${APP_BILLING_RAZORPAY_WEBHOOK_RETRY_BASE_SECONDS:-300}
      APP_BILLING_RAZORPAY_WEBHOOK_CLAIM_SECONDS: ${APP_BILLING_RAZORPAY_WEBHOOK_CLAIM_SECONDS:-120}
      APP_BILLING_RAZORPAY_WEBHOOK_MAX_AGE_SECONDS: ${APP_BILLING_RAZORPAY_WEBHOOK_MAX_AGE_SECONDS:-300}
      APP_BILLING_RAZORPAY_WEBHOOK_FUTURE_SKEW_SECONDS: ${APP_BILLING_RAZORPAY_WEBHOOK_FUTURE_SKEW_SECONDS:-60}
      APP_BILLING_RAZORPAY_DUNNING_CLAIM_SECONDS: ${APP_BILLING_RAZORPAY_DUNNING_CLAIM_SECONDS:-300}
      APP_BILLING_RAZORPAY_AUTOMATIC_RENEWAL_CLAIM_SECONDS: ${APP_BILLING_RAZORPAY_AUTOMATIC_RENEWAL_CLAIM_SECONDS:-300}
      APP_BILLING_RAZORPAY_AUTOMATIC_RENEWAL_INTERVAL_MS: ${APP_BILLING_RAZORPAY_AUTOMATIC_RENEWAL_INTERVAL_MS:-60000}
      APP_BILLING_RAZORPAY_AUTOMATIC_RENEWAL_INITIAL_DELAY_MS: ${APP_BILLING_RAZORPAY_AUTOMATIC_RENEWAL_INITIAL_DELAY_MS:-60000}
      META_WHATSAPP_ENABLED: ${META_WHATSAPP_ENABLED:-false}
      META_WHATSAPP_APP_ID: ${META_WHATSAPP_APP_ID:-}
      META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-}
      META_WHATSAPP_CONFIGURATION_ID: ${META_WHATSAPP_CONFIGURATION_ID:-}
      META_WHATSAPP_GRAPH_API_VERSION: ${META_WHATSAPP_GRAPH_API_VERSION:-v26.0}
      META_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${META_WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      META_WHATSAPP_SIGNUP_SESSION_TTL: ${META_WHATSAPP_SIGNUP_SESSION_TTL:-10m}
      META_WHATSAPP_REGISTER_PHONE_NUMBER: ${META_WHATSAPP_REGISTER_PHONE_NUMBER:-true}
      META_ADS_ENABLED: ${META_ADS_ENABLED:-false}
      META_ADS_APP_ID: ${META_ADS_APP_ID:-}
      META_ADS_APP_SECRET: ${META_ADS_APP_SECRET:-}
      META_ADS_REDIRECT_URI: ${META_ADS_REDIRECT_URI:-http://localhost:8001/api/v1/oauth/meta-ads/callback}
      META_ADS_GRAPH_API_VERSION: ${META_ADS_GRAPH_API_VERSION:-v26.0}
      META_ADS_SCOPE: ${META_ADS_SCOPE:-ads_management,business_management,pages_show_list,pages_read_engagement,instagram_basic}
      META_ADS_OAUTH_STATE_TTL: ${META_ADS_OAUTH_STATE_TTL:-10m}
      META_ADS_WEBHOOK_VERIFY_TOKEN: ${META_ADS_WEBHOOK_VERIFY_TOKEN:-}
      JAVA_TOOL_OPTIONS: "${BACKEND_JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=64m -Xss512k -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError}"
      APP_DATASOURCE_WRITE_URL: jdbc:postgresql://postgres:${POSTGRES_CONTAINER_PORT}/${POSTGRES_DB}
      APP_DATASOURCE_WRITE_USERNAME: ${POSTGRES_USER}
      APP_DATASOURCE_WRITE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DATASOURCE_WRITE_MAX_POOL_SIZE: ${APP_DATASOURCE_WRITE_MAX_POOL_SIZE:-25}
      APP_DATASOURCE_WRITE_MIN_IDLE: ${APP_DATASOURCE_WRITE_MIN_IDLE:-1}
      APP_DATASOURCE_READ_URL: jdbc:postgresql://postgres:${POSTGRES_CONTAINER_PORT}/${POSTGRES_DB}
      APP_DATASOURCE_READ_USERNAME: ${POSTGRES_USER}
      APP_DATASOURCE_READ_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DATASOURCE_READ_MAX_POOL_SIZE: ${APP_DATASOURCE_READ_MAX_POOL_SIZE:-25}
      APP_DATASOURCE_READ_MIN_IDLE: ${APP_DATASOURCE_READ_MIN_IDLE:-1}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: ${REDIS_CONTAINER_PORT}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_CONTAINER_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      REDIS_POOL_MAX_ACTIVE: ${REDIS_POOL_MAX_ACTIVE:-20}
      REDIS_POOL_MAX_IDLE: ${REDIS_POOL_MAX_IDLE:-10}
      REDIS_POOL_MIN_IDLE: ${REDIS_POOL_MIN_IDLE:-2}
      REDIS_POOL_MAX_WAIT: ${REDIS_POOL_MAX_WAIT:-1s}
      KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_CONTAINER_PORT}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_CONTAINER_PORT}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-messaging-api}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-1}
      KAFKA_RETRY_MAX_ATTEMPTS: ${KAFKA_RETRY_MAX_ATTEMPTS:-4}
      KAFKA_RETRY_INITIAL_DELAY: ${KAFKA_RETRY_INITIAL_DELAY:-5s}
      KAFKA_RETRY_MULTIPLIER: ${KAFKA_RETRY_MULTIPLIER:-2}
      KAFKA_RETRY_MAX_DELAY: ${KAFKA_RETRY_MAX_DELAY:-2m}
      KAFKA_IDEMPOTENCY_TTL: ${KAFKA_IDEMPOTENCY_TTL:-7d}
      KAFKA_CRITICAL_TOPIC: ${KAFKA_CRITICAL_TOPIC:-messaging.jobs.critical}
      KAFKA_CRITICAL_RETRY_TOPIC: ${KAFKA_CRITICAL_RETRY_TOPIC:-messaging.jobs.critical.retry}
      KAFKA_CRITICAL_DLT_TOPIC: ${KAFKA_CRITICAL_DLT_TOPIC:-messaging.jobs.critical.dlt}
      KAFKA_CRITICAL_PARTITIONS: ${KAFKA_CRITICAL_PARTITIONS:-6}
      KAFKA_CRITICAL_CONCURRENCY: ${KAFKA_CRITICAL_CONCURRENCY:-4}
      KAFKA_CRITICAL_MAX_POLL_RECORDS: ${KAFKA_CRITICAL_MAX_POLL_RECORDS:-10}
      KAFKA_CRITICAL_CONSUMER_GROUP: ${KAFKA_CRITICAL_CONSUMER_GROUP:-messaging-critical-workers}
      KAFKA_HIGH_TOPIC: ${KAFKA_HIGH_TOPIC:-messaging.jobs.high}
      KAFKA_HIGH_RETRY_TOPIC: ${KAFKA_HIGH_RETRY_TOPIC:-messaging.jobs.high.retry}
      KAFKA_HIGH_DLT_TOPIC: ${KAFKA_HIGH_DLT_TOPIC:-messaging.jobs.high.dlt}
      KAFKA_HIGH_PARTITIONS: ${KAFKA_HIGH_PARTITIONS:-8}
      KAFKA_HIGH_CONCURRENCY: ${KAFKA_HIGH_CONCURRENCY:-4}
      KAFKA_HIGH_MAX_POLL_RECORDS: ${KAFKA_HIGH_MAX_POLL_RECORDS:-25}
      KAFKA_HIGH_CONSUMER_GROUP: ${KAFKA_HIGH_CONSUMER_GROUP:-messaging-high-workers}
      KAFKA_MEDIUM_TOPIC: ${KAFKA_MEDIUM_TOPIC:-messaging.jobs.medium}
      KAFKA_MEDIUM_RETRY_TOPIC: ${KAFKA_MEDIUM_RETRY_TOPIC:-messaging.jobs.medium.retry}
      KAFKA_MEDIUM_DLT_TOPIC: ${KAFKA_MEDIUM_DLT_TOPIC:-messaging.jobs.medium.dlt}
      KAFKA_MEDIUM_PARTITIONS: ${KAFKA_MEDIUM_PARTITIONS:-6}
      KAFKA_MEDIUM_CONCURRENCY: ${KAFKA_MEDIUM_CONCURRENCY:-2}
      KAFKA_MEDIUM_MAX_POLL_RECORDS: ${KAFKA_MEDIUM_MAX_POLL_RECORDS:-50}
      KAFKA_MEDIUM_CONSUMER_GROUP: ${KAFKA_MEDIUM_CONSUMER_GROUP:-messaging-medium-workers}
      KAFKA_LOW_TOPIC: ${KAFKA_LOW_TOPIC:-messaging.jobs.low}
      KAFKA_LOW_RETRY_TOPIC: ${KAFKA_LOW_RETRY_TOPIC:-messaging.jobs.low.retry}
      KAFKA_LOW_DLT_TOPIC: ${KAFKA_LOW_DLT_TOPIC:-messaging.jobs.low.dlt}
      KAFKA_LOW_PARTITIONS: ${KAFKA_LOW_PARTITIONS:-3}
      KAFKA_LOW_CONCURRENCY: ${KAFKA_LOW_CONCURRENCY:-1}
      KAFKA_LOW_MAX_POLL_RECORDS: ${KAFKA_LOW_MAX_POLL_RECORDS:-100}
      KAFKA_LOW_CONSUMER_GROUP: ${KAFKA_LOW_CONSUMER_GROUP:-messaging-low-workers}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OTP_EMAIL_SUBJECT: ${OTP_EMAIL_SUBJECT}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      JWT_ACCESS_COOKIE_NAME: ${JWT_ACCESS_COOKIE_NAME}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME}
      JWT_ACCESS_COOKIE_MAX_AGE: ${JWT_ACCESS_COOKIE_MAX_AGE}
      JWT_REFRESH_COOKIE_MAX_AGE: ${JWT_REFRESH_COOKIE_MAX_AGE}
      JWT_COOKIE_PATH: ${JWT_COOKIE_PATH}
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN}
      JWT_COOKIE_HTTP_ONLY: ${JWT_COOKIE_HTTP_ONLY}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE}
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE}
      OTP_TTL: ${OTP_TTL}
      OTP_RESEND_COOLDOWN: ${OTP_RESEND_COOLDOWN}
      OTP_LENGTH: ${OTP_LENGTH}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL}
      MEDIA_STORAGE_DEFAULT_PROVIDER: ${MEDIA_STORAGE_DEFAULT_PROVIDER}
      MEDIA_UPLOAD_URL_EXPIRY: ${MEDIA_UPLOAD_URL_EXPIRY}
      MEDIA_DOWNLOAD_URL_EXPIRY: ${MEDIA_DOWNLOAD_URL_EXPIRY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_MEDIA_BUCKET: ${SUPABASE_MEDIA_BUCKET}
      MEDIA_IMAGE_MAX_SIZE: ${MEDIA_IMAGE_MAX_SIZE}
      MEDIA_DOCUMENT_MAX_SIZE: ${MEDIA_DOCUMENT_MAX_SIZE}
      MEDIA_VIDEO_MAX_SIZE: ${MEDIA_VIDEO_MAX_SIZE}
      MEDIA_AUDIO_MAX_SIZE: ${MEDIA_AUDIO_MAX_SIZE}
      MEDIA_OTHER_MAX_SIZE: ${MEDIA_OTHER_MAX_SIZE}
      MEDIA_PENDING_TTL: ${MEDIA_PENDING_TTL}
      MEDIA_ALLOWED_MIME_TYPES: ${MEDIA_ALLOWED_MIME_TYPES}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - messaging

  postgres:
    image: ${POSTGRES_IMAGE}
    mem_limit: 512m
    container_name: messaging-postgres
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    command: ["postgres", "-p", "${POSTGRES_CONTAINER_PORT}", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_CONTAINER_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging

  redis:
    image: ${REDIS_IMAGE}
    mem_limit: 128m
    container_name: messaging-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:${REDIS_CONTAINER_PORT}"
    command: ["redis-server", "--port", "${REDIS_CONTAINER_PORT}", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_CONTAINER_PORT} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging

  kafka:
    image: ${KAFKA_IMAGE}
    container_name: messaging-kafka
    ports:
      - "${KAFKA_HOST_PORT}:${KAFKA_CONTAINER_PORT}"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_LISTENERS: PLAINTEXT://:${KAFKA_CONTAINER_PORT},CONTROLLER://:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_CONTAINER_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:${KAFKA_CONTAINER_PORT} --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - messaging

volumes:
  postgres18-data:
  redis-data:
  kafka-data:

networks:
  messaging:
    driver: bridge
