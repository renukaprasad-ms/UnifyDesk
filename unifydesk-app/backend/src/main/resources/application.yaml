spring:
  application:
    name: app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5001/messaging}
    username: ${SPRING_DATASOURCE_USERNAME:messaging}
    password: ${SPRING_DATASOURCE_PASSWORD:messaging}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    url: ${SPRING_FLYWAY_URL:${APP_DATASOURCE_WRITE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5001/messaging}}}
    user: ${SPRING_FLYWAY_USER:${APP_DATASOURCE_WRITE_USERNAME:${SPRING_DATASOURCE_USERNAME:messaging}}}
    password: ${SPRING_FLYWAY_PASSWORD:${APP_DATASOURCE_WRITE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:messaging}}}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
  data:
    redis:
      host: ${REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6001}}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:20}
          max-idle: ${REDIS_POOL_MAX_IDLE:10}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:1s}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${SMTP_TIMEOUT:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT:5000}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9001}}
    client-id: ${KAFKA_CLIENT_ID:messaging-api}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:30000}
        linger.ms: ${KAFKA_LINGER_MS:5}
        batch.size: ${KAFKA_BATCH_SIZE:16384}
        compression.type: ${KAFKA_COMPRESSION_TYPE:none}
        max.in.flight.requests.per.connection: ${KAFKA_MAX_IN_FLIGHT_REQUESTS:5}
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:messaging-workers}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.messaging.kafka.event
        spring.json.value.default.type: com.messaging.kafka.event.KafkaEvent
        max.poll.records: ${KAFKA_MAX_POLL_RECORDS:50}
        max.poll.interval.ms: ${KAFKA_MAX_POLL_INTERVAL_MS:300000}
        session.timeout.ms: ${KAFKA_SESSION_TIMEOUT_MS:45000}
        heartbeat.interval.ms: ${KAFKA_HEARTBEAT_INTERVAL_MS:15000}

app:
  company:
    max-owned-workspaces: ${APP_COMPANY_MAX_OWNED_WORKSPACES:3}
  billing:
    # New first-party Mail service uses its own project IDs and usage ledger.
    # Explicit Super Admin linking is required; imported events are reporting-only.
    mail-bridge:
      enabled: ${APP_BILLING_MAIL_BRIDGE_ENABLED:false}
      base-url: ${APP_BILLING_MAIL_BRIDGE_BASE_URL:}
      internal-token: ${APP_BILLING_MAIL_BRIDGE_INTERNAL_TOKEN:}
      batch-size: ${APP_BILLING_MAIL_BRIDGE_BATCH_SIZE:100}
      sync-interval-ms: ${APP_BILLING_MAIL_BRIDGE_SYNC_INTERVAL_MS:300000}
      sync-initial-delay-ms: ${APP_BILLING_MAIL_BRIDGE_INITIAL_DELAY_MS:60000}
    cashfree:
      enabled: ${APP_BILLING_CASHFREE_ENABLED:false}
      base-url: ${APP_BILLING_CASHFREE_BASE_URL:https://sandbox.cashfree.com}
      client-id: ${APP_BILLING_CASHFREE_CLIENT_ID:}
      client-secret: ${APP_BILLING_CASHFREE_CLIENT_SECRET:}
      payments-api-version: ${APP_BILLING_CASHFREE_PAYMENTS_API_VERSION:2025-01-01}
      subscriptions-api-version: ${APP_BILLING_CASHFREE_SUBSCRIPTIONS_API_VERSION:2025-01-01}
      return-url: ${APP_BILLING_CASHFREE_RETURN_URL:https://app.unifydesk.in/billing/payment-return}
      notify-url: ${APP_BILLING_CASHFREE_NOTIFY_URL:https://api.unifydesk.in/api/v1/webhooks/cashfree}
      reconciliation-interval-ms: ${APP_BILLING_CASHFREE_RECONCILIATION_INTERVAL_MS:300000}
      reconciliation-initial-delay-ms: ${APP_BILLING_CASHFREE_RECONCILIATION_INITIAL_DELAY_MS:60000}
      webhook-max-attempts: ${APP_BILLING_CASHFREE_WEBHOOK_MAX_ATTEMPTS:8}
      webhook-retry-base-seconds: ${APP_BILLING_CASHFREE_WEBHOOK_RETRY_BASE_SECONDS:300}
      webhook-claim-seconds: ${APP_BILLING_CASHFREE_WEBHOOK_CLAIM_SECONDS:120}
      webhook-max-age-seconds: ${APP_BILLING_CASHFREE_WEBHOOK_MAX_AGE_SECONDS:300}
      webhook-future-skew-seconds: ${APP_BILLING_CASHFREE_WEBHOOK_FUTURE_SKEW_SECONDS:60}
      dunning-claim-seconds: ${APP_BILLING_CASHFREE_DUNNING_CLAIM_SECONDS:300}
      automatic-renewal-claim-seconds: ${APP_BILLING_CASHFREE_AUTOMATIC_RENEWAL_CLAIM_SECONDS:300}
      automatic-renewal-interval-ms: ${APP_BILLING_CASHFREE_AUTOMATIC_RENEWAL_INTERVAL_MS:60000}
      automatic-renewal-initial-delay-ms: ${APP_BILLING_CASHFREE_AUTOMATIC_RENEWAL_INITIAL_DELAY_MS:60000}
  recipient-action:
    encryption-key: ${APP_RECIPIENT_ACTION_KEY:}
    token-ttl: ${APP_RECIPIENT_ACTION_TOKEN_TTL:365d}
    clock-skew: ${APP_RECIPIENT_ACTION_CLOCK_SKEW:5m}
    frontend-base-url: ${APP_FRONTEND_BASE_URL:https://app.unifydesk.in}
    public-api-base-url: ${APP_PUBLIC_API_BASE_URL:https://api.unifydesk.in}
  notification-platform:
    frontend-base-url: ${APP_NOTIFICATION_FRONTEND_BASE_URL:${APP_FRONTEND_BASE_URL:https://app.unifydesk.in}}
    core:
      outbox:
        batch-size: ${APP_NOTIFICATION_OUTBOX_BATCH_SIZE:100}
        poll-interval-ms: ${APP_NOTIFICATION_OUTBOX_POLL_INTERVAL_MS:750}
        lease: ${APP_NOTIFICATION_OUTBOX_LEASE:30s}
        recovery-after: ${APP_NOTIFICATION_OUTBOX_RECOVERY_AFTER:5m}
        max-attempts: ${APP_NOTIFICATION_OUTBOX_MAX_ATTEMPTS:20}
        retry-initial-backoff: ${APP_NOTIFICATION_OUTBOX_RETRY_INITIAL_BACKOFF:1s}
        retry-max-backoff: ${APP_NOTIFICATION_OUTBOX_RETRY_MAX_BACKOFF:1m}
        publish-timeout: ${APP_NOTIFICATION_OUTBOX_PUBLISH_TIMEOUT:30s}
      fanout:
        claim-size: ${APP_NOTIFICATION_FANOUT_CLAIM_SIZE:10}
        recipient-batch-size: ${APP_NOTIFICATION_FANOUT_RECIPIENT_BATCH_SIZE:500}
        poll-interval-ms: ${APP_NOTIFICATION_FANOUT_POLL_INTERVAL_MS:750}
        lease: ${APP_NOTIFICATION_FANOUT_LEASE:1m}
        max-attempts: ${APP_NOTIFICATION_FANOUT_MAX_ATTEMPTS:20}
        retry-initial-backoff: ${APP_NOTIFICATION_FANOUT_RETRY_INITIAL_BACKOFF:2s}
        retry-max-backoff: ${APP_NOTIFICATION_FANOUT_RETRY_MAX_BACKOFF:5m}
      reconciliation:
        batch-size: ${APP_NOTIFICATION_RECONCILIATION_BATCH_SIZE:100}
        interval-ms: ${APP_NOTIFICATION_RECONCILIATION_INTERVAL_MS:900000}
    delivery:
      enabled: ${APP_NOTIFICATION_DELIVERY_ENABLED:true}
      claim-batch-size: ${APP_NOTIFICATION_DELIVERY_CLAIM_BATCH_SIZE:100}
      claim-lease: ${APP_NOTIFICATION_DELIVERY_CLAIM_LEASE:2m}
      poll-delay: ${APP_NOTIFICATION_DELIVERY_POLL_DELAY:1s}
      email-max-attempts: ${APP_NOTIFICATION_EMAIL_MAX_ATTEMPTS:5}
    retention:
      events: ${APP_NOTIFICATION_EVENT_RETENTION:90d}
      notifications: ${APP_NOTIFICATION_HISTORY_RETENTION:180d}
      delivery-intents: ${APP_NOTIFICATION_DELIVERY_RETENTION:90d}
      cleanup-batch-size: ${APP_NOTIFICATION_CLEANUP_BATCH_SIZE:1000}
      cleanup-interval-ms: ${APP_NOTIFICATION_CLEANUP_INTERVAL_MS:86400000}
      cleanup-initial-delay-ms: ${APP_NOTIFICATION_CLEANUP_INITIAL_DELAY_MS:300000}
    digest:
      enabled: ${APP_NOTIFICATION_DIGEST_ENABLED:true}
      aggregation-batch-size: ${APP_NOTIFICATION_DIGEST_AGGREGATION_BATCH_SIZE:250}
      threshold: ${APP_NOTIFICATION_DIGEST_THRESHOLD:10}
      trigger-count: ${APP_NOTIFICATION_DIGEST_THRESHOLD:10}
      max-wait: ${APP_NOTIFICATION_DIGEST_MAX_WAIT:2h}
      debounce: ${APP_NOTIFICATION_DIGEST_DEBOUNCE:15m}
      cooldown: ${APP_NOTIFICATION_DIGEST_COOLDOWN:4h}
      optional-email-rolling-cap: ${APP_NOTIFICATION_EMAIL_OPTIONAL_ROLLING_24H_CAP:3}
      rolling-window: ${APP_NOTIFICATION_EMAIL_ROLLING_WINDOW:24h}
      poll-delay: ${APP_NOTIFICATION_DIGEST_POLL_DELAY:1m}
    email:
      enabled: ${APP_NOTIFICATION_EMAIL_ENABLED:true}
      optional-rolling24h-cap: ${APP_NOTIFICATION_EMAIL_OPTIONAL_ROLLING_24H_CAP:3}
    push:
      vapid-public-key: ${APP_NOTIFICATION_PUSH_VAPID_PUBLIC_KEY:}
      vapid-private-key: ${APP_NOTIFICATION_PUSH_VAPID_PRIVATE_KEY:}
      vapid-subject: ${APP_NOTIFICATION_PUSH_VAPID_SUBJECT:mailto:support@unifydesk.in}
      max-subscriptions-per-user: ${APP_NOTIFICATION_PUSH_MAX_SUBSCRIPTIONS_PER_USER:10}
      max-active-subscriptions: ${APP_NOTIFICATION_PUSH_MAX_SUBSCRIPTIONS_PER_USER:10}
      target-payload-bytes: ${APP_NOTIFICATION_PUSH_TARGET_PAYLOAD_BYTES:2048}
      max-payload-bytes: ${APP_NOTIFICATION_PUSH_MAX_PAYLOAD_BYTES:4096}
      max-attempts: ${APP_NOTIFICATION_PUSH_MAX_ATTEMPTS:4}
      inbox-ttl: ${APP_NOTIFICATION_PUSH_INBOX_TTL:30m}
      default-ttl: ${APP_NOTIFICATION_PUSH_DEFAULT_TTL:15m}
      cleanup-delay: ${APP_NOTIFICATION_PUSH_CLEANUP_DELAY:1h}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://app.unifydesk.in}
  lifecycle:
    deletion:
      retention: ${DELETION_RETENTION:30d}
      retry-delay: ${DELETION_RETRY_DELAY:1h}
      stale-after: ${DELETION_STALE_AFTER:1h}
      batch-size: ${DELETION_JOB_BATCH_SIZE:20}
      row-batch-size: ${DELETION_ROW_BATCH_SIZE:5000}
      max-row-batches-per-run: ${DELETION_MAX_ROW_BATCHES_PER_RUN:4}
      media-batch-size: ${DELETION_MEDIA_BATCH_SIZE:250}
      scheduler-interval: ${DELETION_SCHEDULER_INTERVAL:1m}
      scheduler-initial-delay: ${DELETION_SCHEDULER_INITIAL_DELAY:1m}
  realtime:
    redis-channel: ${REALTIME_REDIS_CHANNEL:messaging:realtime}
    heartbeat-interval-ms: ${REALTIME_HEARTBEAT_INTERVAL_MS:30000}
    allowed-origins: ${REALTIME_ALLOWED_ORIGINS:https://app.unifydesk.in}
  broadcast:
    member-write-batch-size: ${BROADCAST_MEMBER_WRITE_BATCH_SIZE:500}
    snapshot-batch-size: ${BROADCAST_SNAPSHOT_BATCH_SIZE:100}
    recipient-claim-size: ${BROADCAST_RECIPIENT_CLAIM_SIZE:10}
    worker-concurrency: ${BROADCAST_WORKER_CONCURRENCY:8}
    worker-poll-interval-ms: ${BROADCAST_WORKER_POLL_INTERVAL_MS:250}
    max-delivery-attempts: ${BROADCAST_MAX_DELIVERY_ATTEMPTS:5}
    retry-initial-backoff: ${BROADCAST_RETRY_INITIAL_BACKOFF:2s}
    retry-max-backoff: ${BROADCAST_RETRY_MAX_BACKOFF:5m}
    stale-claim-after: ${BROADCAST_STALE_CLAIM_AFTER:5m}
    outbox-batch-size: ${BROADCAST_OUTBOX_BATCH_SIZE:50}
    outbox-poll-interval-ms: ${BROADCAST_OUTBOX_POLL_INTERVAL_MS:250}
    outbox-stale-after: ${BROADCAST_OUTBOX_STALE_AFTER:2m}
    outbox-max-attempts: ${BROADCAST_OUTBOX_MAX_ATTEMPTS:20}
    message-id-domain: ${BROADCAST_MESSAGE_ID_DOMAIN:unifydesk.in}
    ses-max-per-second-cap: ${BROADCAST_SES_MAX_PER_SECOND_CAP:1000}
    send-grid-max-per-second-cap: ${BROADCAST_SENDGRID_MAX_PER_SECOND_CAP:20}
    azure-email-max-per-second-cap: ${BROADCAST_AZURE_EMAIL_MAX_PER_SECOND_CAP:0.5}
    msg91-max-per-second-cap: ${BROADCAST_MSG91_MAX_PER_SECOND_CAP:20}
    msg91-email-max-per-second-cap: ${BROADCAST_MSG91_EMAIL_MAX_PER_SECOND_CAP:20}
    provider-max-per-second-cap: ${BROADCAST_PROVIDER_MAX_PER_SECOND_CAP:1000}
  managed-sms:
    enabled: ${APP_MANAGED_SMS_ENABLED:false}
    provider: ${APP_MANAGED_SMS_PROVIDER:MSG91_SMS}
    provider-mode: ${APP_MANAGED_SMS_PROVIDER_MODE:CHILD_PER_COMPANY}
    master-auth-key: ${APP_MANAGED_SMS_MASTER_AUTH_KEY:}
    allow-shared-master: ${APP_MANAGED_SMS_ALLOW_SHARED_MASTER:false}
    webhook-token-key: ${APP_MANAGED_SMS_WEBHOOK_TOKEN_KEY:}
    webhook-previous-token-key: ${APP_MANAGED_SMS_WEBHOOK_PREVIOUS_TOKEN_KEY:}
    webhook-previous-token-valid-until: ${APP_MANAGED_SMS_WEBHOOK_PREVIOUS_TOKEN_VALID_UNTIL:}
    compliance-stale-after: ${APP_MANAGED_SMS_COMPLIANCE_STALE_AFTER:7d}
    provisioning-poll-interval: ${APP_MANAGED_SMS_PROVISIONING_POLL_INTERVAL:5s}
    provisioning-stale-after: ${APP_MANAGED_SMS_PROVISIONING_STALE_AFTER:5m}
    compliance-refresh-interval: ${APP_MANAGED_SMS_COMPLIANCE_REFRESH_INTERVAL:5m}
    provider-observation-poll-ms: ${APP_MANAGED_SMS_PROVIDER_OBSERVATION_POLL_MS:60000}
    platform-sending-enabled: ${APP_MANAGED_SMS_PLATFORM_SENDING_ENABLED:false}
    global-max-per-second: ${APP_MANAGED_SMS_GLOBAL_MAX_PER_SECOND:20}
    provider-account-max-per-second: ${APP_MANAGED_SMS_ACCOUNT_MAX_PER_SECOND:15}
    company-max-per-second: ${APP_MANAGED_SMS_COMPANY_MAX_PER_SECOND:10}
    run-max-per-second: ${APP_MANAGED_SMS_RUN_MAX_PER_SECOND:5}
    campaign-max-recipients: ${APP_MANAGED_SMS_CAMPAIGN_MAX_RECIPIENTS:5000}
    new-tenant-hourly-cap: ${APP_MANAGED_SMS_NEW_TENANT_HOURLY_CAP:100}
    new-tenant-daily-cap: ${APP_MANAGED_SMS_NEW_TENANT_DAILY_CAP:500}
    provider-balance-reserve: ${APP_MANAGED_SMS_PROVIDER_BALANCE_RESERVE:100}
    metareach:
      enabled: ${APP_MANAGED_SMS_METAREACH_ENABLED:false}
      contract-confirmed: ${APP_MANAGED_SMS_METAREACH_CONTRACT_CONFIRMED:false}
      api-key: ${APP_MANAGED_SMS_METAREACH_API_KEY:}
      route-id: ${APP_MANAGED_SMS_METAREACH_ROUTE_ID:1}
      dlr-poll-ms: ${APP_MANAGED_SMS_METAREACH_DLR_POLL_MS:30000}
      dlr-reclaim-ms: ${APP_MANAGED_SMS_METAREACH_DLR_RECLAIM_MS:120000}
    event-replay-window: ${APP_MANAGED_SMS_EVENT_REPLAY_WINDOW:10m}
  managed-email:
    enabled: ${APP_MANAGED_EMAIL_ENABLED:false}
    platform-sending-enabled: ${APP_MANAGED_EMAIL_PLATFORM_SENDING_ENABLED:false}
    aws-region: ${APP_MANAGED_EMAIL_AWS_REGION:ap-south-1}
    hosted-base-domain: ${APP_MANAGED_EMAIL_HOSTED_BASE_DOMAIN:unifydesk.in}
    sns-topic-arn: ${APP_MANAGED_EMAIL_SNS_TOPIC_ARN:}
    cloudflare-zone-id: ${APP_MANAGED_EMAIL_CLOUDFLARE_ZONE_ID:}
    cloudflare-api-token: ${APP_MANAGED_EMAIL_CLOUDFLARE_API_TOKEN:}
    provisioning-poll-interval: ${APP_MANAGED_EMAIL_PROVISIONING_POLL_INTERVAL:2s}
    provisioning-stale-after: ${APP_MANAGED_EMAIL_PROVISIONING_STALE_AFTER:5m}
    verification-refresh-interval: ${APP_MANAGED_EMAIL_VERIFICATION_REFRESH_INTERVAL:5m}
    account-rate-safety-cap: ${APP_MANAGED_EMAIL_ACCOUNT_RATE_SAFETY_CAP:1000}
    new-tenant-hourly-cap: ${APP_MANAGED_EMAIL_NEW_TENANT_HOURLY_CAP:100}
    new-tenant-daily-cap: ${APP_MANAGED_EMAIL_NEW_TENANT_DAILY_CAP:500}
    event-replay-window: ${APP_MANAGED_EMAIL_EVENT_REPLAY_WINDOW:10m}
    control-rate-limit-window: ${APP_MANAGED_EMAIL_CONTROL_RATE_LIMIT_WINDOW:1m}
    customer-domain-create-company-limit: ${APP_MANAGED_EMAIL_CUSTOMER_DOMAIN_CREATE_COMPANY_LIMIT:10}
    customer-domain-create-user-limit: ${APP_MANAGED_EMAIL_CUSTOMER_DOMAIN_CREATE_USER_LIMIT:5}
    hosted-domain-create-company-limit: ${APP_MANAGED_EMAIL_HOSTED_DOMAIN_CREATE_COMPANY_LIMIT:10}
    hosted-domain-create-user-limit: ${APP_MANAGED_EMAIL_HOSTED_DOMAIN_CREATE_USER_LIMIT:5}
    domain-refresh-company-limit: ${APP_MANAGED_EMAIL_DOMAIN_REFRESH_COMPANY_LIMIT:30}
    domain-refresh-user-limit: ${APP_MANAGED_EMAIL_DOMAIN_REFRESH_USER_LIMIT:15}
    domain-delete-company-limit: ${APP_MANAGED_EMAIL_DOMAIN_DELETE_COMPANY_LIMIT:10}
    domain-delete-user-limit: ${APP_MANAGED_EMAIL_DOMAIN_DELETE_USER_LIMIT:5}
    sender-create-company-limit: ${APP_MANAGED_EMAIL_SENDER_CREATE_COMPANY_LIMIT:30}
    sender-create-user-limit: ${APP_MANAGED_EMAIL_SENDER_CREATE_USER_LIMIT:15}
    sender-disable-company-limit: ${APP_MANAGED_EMAIL_SENDER_DISABLE_COMPANY_LIMIT:30}
    sender-disable-user-limit: ${APP_MANAGED_EMAIL_SENDER_DISABLE_USER_LIMIT:15}
    runtime:
      sending-enabled: ${APP_MANAGED_EMAIL_PLATFORM_SENDING_ENABLED:false}
      region: ${APP_MANAGED_EMAIL_AWS_REGION:ap-south-1}
      sns-topic-arn: ${APP_MANAGED_EMAIL_SNS_TOPIC_ARN:}
      account-safety-max-per-second: ${APP_MANAGED_EMAIL_ACCOUNT_RATE_SAFETY_CAP:1000}
      company-max-per-second: ${APP_MANAGED_EMAIL_COMPANY_MAX_PER_SECOND:25}
      plan-max-per-second: ${APP_MANAGED_EMAIL_PLAN_MAX_PER_SECOND:25}
      run-max-per-second: ${APP_MANAGED_EMAIL_RUN_MAX_PER_SECOND:10}
      new-tenant-max-per-second: ${APP_MANAGED_EMAIL_NEW_TENANT_MAX_PER_SECOND:2}
      account-daily-safety-cap: ${APP_MANAGED_EMAIL_ACCOUNT_DAILY_SAFETY_CAP:50000}
      new-tenant-hourly-cap: ${APP_MANAGED_EMAIL_NEW_TENANT_HOURLY_CAP:100}
      new-tenant-daily-cap: ${APP_MANAGED_EMAIL_NEW_TENANT_DAILY_CAP:500}
      established-hourly-cap: ${APP_MANAGED_EMAIL_ESTABLISHED_HOURLY_CAP:5000}
      established-daily-cap: ${APP_MANAGED_EMAIL_ESTABLISHED_DAILY_CAP:25000}
      campaign-size-cap: ${APP_MANAGED_EMAIL_CAMPAIGN_SIZE_CAP:5000}
      provider-snapshot-max-age-seconds: ${APP_MANAGED_EMAIL_PROVIDER_SNAPSHOT_MAX_AGE_SECONDS:300}
      provider-effect-poll-batch-size: ${APP_MANAGED_EMAIL_PROVIDER_EFFECT_POLL_BATCH_SIZE:25}
      provider-effect-stale-after-seconds: ${APP_MANAGED_EMAIL_PROVIDER_EFFECT_STALE_AFTER_SECONDS:120}
      provider-effect-max-attempts: ${APP_MANAGED_EMAIL_PROVIDER_EFFECT_MAX_ATTEMPTS:8}
      provider-effect-retry-initial-seconds: ${APP_MANAGED_EMAIL_PROVIDER_EFFECT_RETRY_INITIAL_SECONDS:2}
      provider-effect-retry-max-seconds: ${APP_MANAGED_EMAIL_PROVIDER_EFFECT_RETRY_MAX_SECONDS:900}
      sns-replay-window-seconds: ${APP_MANAGED_EMAIL_SNS_REPLAY_WINDOW_SECONDS:600}
      webhook-max-bytes: ${APP_MANAGED_EMAIL_WEBHOOK_MAX_BYTES:262144}
      webhook-max-json-depth: ${APP_MANAGED_EMAIL_WEBHOOK_MAX_JSON_DEPTH:32}
      signing-certificate-max-bytes: ${APP_MANAGED_EMAIL_SIGNING_CERTIFICATE_MAX_BYTES:65536}
      stale-reservation-minutes: ${APP_MANAGED_EMAIL_STALE_RESERVATION_MINUTES:30}
      reputation-window-hours: ${APP_MANAGED_EMAIL_REPUTATION_WINDOW_HOURS:24}
      minimum-reputation-sample-size: ${APP_MANAGED_EMAIL_REPUTATION_MIN_SAMPLE:100}
      warning-hard-bounce-rate: ${APP_MANAGED_EMAIL_WARNING_HARD_BOUNCE_RATE:0.03}
      warning-complaint-rate: ${APP_MANAGED_EMAIL_WARNING_COMPLAINT_RATE:0.001}
      throttle-hard-bounce-rate: ${APP_MANAGED_EMAIL_THROTTLE_HARD_BOUNCE_RATE:0.05}
      throttle-complaint-rate: ${APP_MANAGED_EMAIL_THROTTLE_COMPLAINT_RATE:0.002}
      suspension-hard-bounce-rate: ${APP_MANAGED_EMAIL_SUSPENSION_HARD_BOUNCE_RATE:0.08}
