map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $messaging_forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Meta Embedded Signup uses a cross-origin popup and postMessage.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # Keep the realtime upgrade on a dedicated proxy path. This avoids the
  # WebSocket handshake being treated like a normal API request by an
  # intermediary and makes the upgrade semantics explicit end-to-end.
  location = /api/v1/realtime/ws {
    proxy_pass http://messaging-backend:8001/api/v1/realtime/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $messaging_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://messaging-backend:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $messaging_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Vite emits content-hashed assets, so they can be cached aggressively.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  }

  # The SPA shell must stay fresh so a deployment always discovers the newest
  # content-hashed asset names instead of serving an old UI from cache.
  location = /index.html {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
