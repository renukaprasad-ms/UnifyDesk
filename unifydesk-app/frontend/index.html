<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="application-name" content="UnifyDesk" />
    <meta
      name="description"
      content="UnifyDesk customer communication, broadcast and advertising workspace."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(() => {
        try {
          const raw = window.localStorage.getItem('unifydesk.companyTheme.global')
          if (!raw) return
          const theme = JSON.parse(raw)
          if (theme?.mode !== 'dark') return

          const darkPalettes = {
            blue: ['#60a5fa', '#93c5fd', '#1e3a5f', '#10243c', '#3b82f6'],
            orange: ['#fb923c', '#fdba74', '#5b2a12', '#2f1b10', '#f97316'],
            emerald: ['#34d399', '#6ee7b7', '#164e3b', '#102920', '#10b981'],
            rose: ['#fb7185', '#fda4af', '#5a1f2d', '#34131d', '#f43f5e'],
            violet: ['#a78bfa', '#c4b5fd', '#3b2467', '#221735', '#8b5cf6'],
            slate: ['#cbd5e1', '#f1f5f9', '#334155', '#1f2937', '#64748b'],
          }
          const [primary, hover, soft, softer, ring] =
            darkPalettes[theme.colorId] || darkPalettes.blue
          const root = document.documentElement
          root.dataset.colorScheme = 'dark'
          root.style.colorScheme = 'dark'
          root.style.background = '#0f172a'
          root.style.setProperty('--theme-primary', primary)
          root.style.setProperty('--theme-primary-hover', hover)
          root.style.setProperty('--theme-primary-soft', soft)
          root.style.setProperty('--theme-primary-softer', softer)
          root.style.setProperty('--theme-primary-ring', ring)
          root.style.setProperty('--theme-bg', '#0f172a')
          root.style.setProperty('--theme-surface', '#111827')
          root.style.setProperty('--theme-surface-subtle', '#172033')
          root.style.setProperty('--theme-border', '#263449')
          root.style.setProperty('--theme-border-soft', '#1f2a3d')
          root.style.setProperty('--theme-text', '#e5edf8')
          root.style.setProperty('--theme-muted', '#94a3b8')
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0f172a')
        } catch {
          // Keep the default light boot paint if stored theme data is unavailable.
        }
      })()
    </script>
    <title>UnifyDesk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
