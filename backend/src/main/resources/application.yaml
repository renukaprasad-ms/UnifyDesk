spring:
  application:
    name: app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5001/messaging}
    username: ${SPRING_DATASOURCE_USERNAME:messaging}
    password: ${SPRING_DATASOURCE_PASSWORD:messaging}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    url: ${SPRING_FLYWAY_URL:${APP_DATASOURCE_WRITE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5001/messaging}}}
    user: ${SPRING_FLYWAY_USER:${APP_DATASOURCE_WRITE_USERNAME:${SPRING_DATASOURCE_USERNAME:messaging}}}
    password: ${SPRING_FLYWAY_PASSWORD:${APP_DATASOURCE_WRITE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:messaging}}}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
  data:
    redis:
      host: ${REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6001}}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:20}
          max-idle: ${REDIS_POOL_MAX_IDLE:10}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:1s}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${SMTP_TIMEOUT:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT:5000}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9001}}
    client-id: ${KAFKA_CLIENT_ID:messaging-api}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:30000}
        linger.ms: ${KAFKA_LINGER_MS:5}
        batch.size: ${KAFKA_BATCH_SIZE:16384}
        compression.type: ${KAFKA_COMPRESSION_TYPE:none}
        max.in.flight.requests.per.connection: ${KAFKA_MAX_IN_FLIGHT_REQUESTS:5}
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:messaging-workers}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.messaging.kafka.event
        spring.json.value.default.type: com.messaging.kafka.event.KafkaEvent
        max.poll.records: ${KAFKA_MAX_POLL_RECORDS:50}
        max.poll.interval.ms: ${KAFKA_MAX_POLL_INTERVAL_MS:300000}
        session.timeout.ms: ${KAFKA_SESSION_TIMEOUT_MS:45000}
        heartbeat.interval.ms: ${KAFKA_HEARTBEAT_INTERVAL_MS:15000}

app:
  lifecycle:
    deletion:
      retention: ${DELETION_RETENTION:30d}
      retry-delay: ${DELETION_RETRY_DELAY:1h}
      stale-after: ${DELETION_STALE_AFTER:1h}
      batch-size: ${DELETION_JOB_BATCH_SIZE:20}
      row-batch-size: ${DELETION_ROW_BATCH_SIZE:5000}
      max-row-batches-per-run: ${DELETION_MAX_ROW_BATCHES_PER_RUN:4}
      media-batch-size: ${DELETION_MEDIA_BATCH_SIZE:250}
      scheduler-interval: ${DELETION_SCHEDULER_INTERVAL:1m}
      scheduler-initial-delay: ${DELETION_SCHEDULER_INITIAL_DELAY:1m}
  realtime:
    redis-channel: ${REALTIME_REDIS_CHANNEL:messaging:realtime}
    heartbeat-interval-ms: ${REALTIME_HEARTBEAT_INTERVAL_MS:30000}
    allowed-origins: ${REALTIME_ALLOWED_ORIGINS:https://messaging.renukaprasad.in}
  broadcast:
    member-write-batch-size: ${BROADCAST_MEMBER_WRITE_BATCH_SIZE:500}
    snapshot-batch-size: ${BROADCAST_SNAPSHOT_BATCH_SIZE:100}
    recipient-claim-size: ${BROADCAST_RECIPIENT_CLAIM_SIZE:10}
    worker-concurrency: ${BROADCAST_WORKER_CONCURRENCY:8}
    worker-poll-interval-ms: ${BROADCAST_WORKER_POLL_INTERVAL_MS:250}
    max-delivery-attempts: ${BROADCAST_MAX_DELIVERY_ATTEMPTS:5}
    retry-initial-backoff: ${BROADCAST_RETRY_INITIAL_BACKOFF:2s}
    retry-max-backoff: ${BROADCAST_RETRY_MAX_BACKOFF:5m}
    stale-claim-after: ${BROADCAST_STALE_CLAIM_AFTER:5m}
    outbox-batch-size: ${BROADCAST_OUTBOX_BATCH_SIZE:50}
    outbox-poll-interval-ms: ${BROADCAST_OUTBOX_POLL_INTERVAL_MS:250}
    outbox-stale-after: ${BROADCAST_OUTBOX_STALE_AFTER:2m}
    outbox-max-attempts: ${BROADCAST_OUTBOX_MAX_ATTEMPTS:20}
    message-id-domain: ${BROADCAST_MESSAGE_ID_DOMAIN:messaging.renukaprasad.in}
    ses-max-per-second-cap: ${BROADCAST_SES_MAX_PER_SECOND_CAP:1000}
    send-grid-max-per-second-cap: ${BROADCAST_SENDGRID_MAX_PER_SECOND_CAP:20}
    azure-email-max-per-second-cap: ${BROADCAST_AZURE_EMAIL_MAX_PER_SECOND_CAP:0.5}
    msg91-max-per-second-cap: ${BROADCAST_MSG91_MAX_PER_SECOND_CAP:20}
    provider-max-per-second-cap: ${BROADCAST_PROVIDER_MAX_PER_SECOND_CAP:1000}
  delivery:
    email:
      claim-size: ${EMAIL_DELIVERY_REPORT_CLAIM_SIZE:100}
      poll-interval-ms: ${EMAIL_DELIVERY_REPORT_POLL_INTERVAL_MS:5000}
      max-attempts: ${EMAIL_DELIVERY_REPORT_MAX_ATTEMPTS:12}
      retry-initial-backoff: ${EMAIL_DELIVERY_REPORT_RETRY_INITIAL_BACKOFF:30s}
      retry-max-backoff: ${EMAIL_DELIVERY_REPORT_RETRY_MAX_BACKOFF:10m}
      stale-after: ${EMAIL_DELIVERY_REPORT_STALE_AFTER:5m}
      match-lookback: ${EMAIL_DELIVERY_REPORT_MATCH_LOOKBACK:14d}
  datasource:
    write:
      url: ${APP_DATASOURCE_WRITE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5001/messaging}}
      username: ${APP_DATASOURCE_WRITE_USERNAME:${SPRING_DATASOURCE_USERNAME:messaging}}
      password: ${APP_DATASOURCE_WRITE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:messaging}}
      max-pool-size: ${APP_DATASOURCE_WRITE_MAX_POOL_SIZE:25}
      min-idle: ${APP_DATASOURCE_WRITE_MIN_IDLE:1}
    read:
      url: ${APP_DATASOURCE_READ_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5001/messaging}}
      username: ${APP_DATASOURCE_READ_USERNAME:${SPRING_DATASOURCE_USERNAME:messaging}}
      password: ${APP_DATASOURCE_READ_PASSWORD:${SPRING_DATASOURCE_PASSWORD:messaging}}
      max-pool-size: ${APP_DATASOURCE_READ_MAX_POOL_SIZE:25}
      min-idle: ${APP_DATASOURCE_READ_MIN_IDLE:1}
  security:
    trust-forwarded-headers: ${APP_SECURITY_TRUST_FORWARDED_HEADERS:false}
    jwt:
      issuer: ${JWT_ISSUER:messaging}
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
      access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
      untrusted-refresh-expiration: ${JWT_UNTRUSTED_REFRESH_EXPIRATION:1d}
      pre-auth-expiration: ${JWT_PRE_AUTH_EXPIRATION:10m}
    cookie:
      access-name: ${JWT_ACCESS_COOKIE_NAME:msid}
      refresh-name: ${JWT_REFRESH_COOKIE_NAME:msid_r}
      pre-auth-name: ${JWT_PRE_AUTH_COOKIE_NAME:msid_pre}
      access-max-age: ${JWT_ACCESS_COOKIE_MAX_AGE:15m}
      refresh-max-age: ${JWT_REFRESH_COOKIE_MAX_AGE:7d}
      pre-auth-max-age: ${JWT_PRE_AUTH_COOKIE_MAX_AGE:10m}
      path: ${JWT_COOKIE_PATH:/}
      domain: ${JWT_COOKIE_DOMAIN:}
      http-only: ${JWT_COOKIE_HTTP_ONLY:true}
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: ${JWT_COOKIE_SAME_SITE:Strict}
  channel:
    credentials:
      master-key: ${CHANNEL_CREDENTIAL_MASTER_KEY:}
    meta-whatsapp:
      enabled: ${META_WHATSAPP_ENABLED:false}
      app-id: ${META_WHATSAPP_APP_ID:}
      app-secret: ${META_WHATSAPP_APP_SECRET:}
      configuration-id: ${META_WHATSAPP_CONFIGURATION_ID:}
      graph-api-version: ${META_WHATSAPP_GRAPH_API_VERSION:v26.0}
      webhook-verify-token: ${META_WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
      signup-session-ttl: ${META_WHATSAPP_SIGNUP_SESSION_TTL:10m}
      register-phone-number: ${META_WHATSAPP_REGISTER_PHONE_NUMBER:true}
    gmail:
      enabled: ${GMAIL_OAUTH_ENABLED:false}
      client-id: ${GMAIL_OAUTH_CLIENT_ID:}
      client-secret: ${GMAIL_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GMAIL_OAUTH_REDIRECT_URI:https://messaging.renukaprasad.in/api/v1/oauth/gmail/callback}
      frontend-base-url: ${APP_FRONTEND_BASE_URL:https://messaging.renukaprasad.in}
      scope: ${GMAIL_OAUTH_SCOPE:https://www.googleapis.com/auth/gmail.modify}
      oauth-state-ttl: ${GMAIL_OAUTH_STATE_TTL:10m}
      token-refresh-skew: ${GMAIL_OAUTH_TOKEN_REFRESH_SKEW:2m}
      initial-sync-days: ${GMAIL_INITIAL_SYNC_DAYS:30}
      initial-sync-max-messages: ${GMAIL_INITIAL_SYNC_MAX_MESSAGES:200}
      sync-max-range-days: ${GMAIL_SYNC_MAX_RANGE_DAYS:366}
      sync-max-messages: ${GMAIL_SYNC_MAX_MESSAGES:100000}
      sync-batch-size: ${GMAIL_SYNC_BATCH_SIZE:25}
      sync-user-quota-units-per-minute: ${GMAIL_SYNC_USER_QUOTA_UNITS_PER_MINUTE:6000}
      sync-message-get-quota-units: ${GMAIL_SYNC_MESSAGE_GET_QUOTA_UNITS:20}
      sync-quota-utilization-percent: ${GMAIL_SYNC_QUOTA_UTILIZATION_PERCENT:80}
      quota-control-enabled: ${GMAIL_QUOTA_CONTROL_ENABLED:true}
      quota-project-units-per-minute: ${GMAIL_QUOTA_PROJECT_UNITS_PER_MINUTE:1200000}
      quota-interactive-reserve-percent: ${GMAIL_QUOTA_INTERACTIVE_RESERVE_PERCENT:20}
      quota-user-burst-units: ${GMAIL_QUOTA_USER_BURST_UNITS:600}
      quota-project-burst-units: ${GMAIL_QUOTA_PROJECT_BURST_UNITS:50000}
      quota-background-user-burst-units: ${GMAIL_QUOTA_BACKGROUND_USER_BURST_UNITS:500}
      quota-background-project-burst-units: ${GMAIL_QUOTA_BACKGROUND_PROJECT_BURST_UNITS:40000}
      quota-bucket-ttl: ${GMAIL_QUOTA_BUCKET_TTL:2m}
      quota-cooldown-initial: ${GMAIL_QUOTA_COOLDOWN_INITIAL:30s}
      quota-cooldown-max: ${GMAIL_QUOTA_COOLDOWN_MAX:5m}
      sync-batch-retry-max-attempts: ${GMAIL_SYNC_BATCH_RETRY_MAX_ATTEMPTS:12}
      sync-batch-retry-initial-backoff: ${GMAIL_SYNC_BATCH_RETRY_INITIAL_BACKOFF:2s}
      sync-batch-retry-max-backoff: ${GMAIL_SYNC_BATCH_RETRY_MAX_BACKOFF:64s}
      sync-batch-recovery-interval: ${GMAIL_SYNC_BATCH_RECOVERY_INTERVAL:1m}
      sync-batch-stale-after: ${GMAIL_SYNC_BATCH_STALE_AFTER:5m}
      sync-batch-recovery-size: ${GMAIL_SYNC_BATCH_RECOVERY_SIZE:100}
      worker-concurrency: ${GMAIL_WORKER_CONCURRENCY:12}
      worker-poll-interval-ms: ${GMAIL_WORKER_POLL_INTERVAL_MS:250}
      api-retry-max-attempts: ${GMAIL_API_RETRY_MAX_ATTEMPTS:4}
      api-retry-initial-backoff: ${GMAIL_API_RETRY_INITIAL_BACKOFF:1s}
      api-retry-max-backoff: ${GMAIL_API_RETRY_MAX_BACKOFF:8s}

      # Gmail server push: users.watch -> Google Cloud Pub/Sub -> webhook -> history.list.
      pubsub-topic-name: ${GMAIL_PUBSUB_TOPIC_NAME:}
      pubsub-push-verification-token: ${GMAIL_PUBSUB_PUSH_VERIFICATION_TOKEN:}
      watch-renew-interval: ${GMAIL_WATCH_RENEW_INTERVAL:1h}
      watch-renew-initial-delay: ${GMAIL_WATCH_RENEW_INITIAL_DELAY:1m}
      watch-renew-after: ${GMAIL_WATCH_RENEW_AFTER:24h}
      realtime-worker-concurrency: ${GMAIL_REALTIME_WORKER_CONCURRENCY:4}
      realtime-worker-poll-interval-ms: ${GMAIL_REALTIME_WORKER_POLL_INTERVAL_MS:500}
      realtime-stale-after: ${GMAIL_REALTIME_STALE_AFTER:5m}
      realtime-max-attempts: ${GMAIL_REALTIME_MAX_ATTEMPTS:12}
      realtime-history-page-size: ${GMAIL_REALTIME_HISTORY_PAGE_SIZE:200}
      realtime-batch-size: ${GMAIL_REALTIME_BATCH_SIZE:25}
      realtime-safety-sync-interval: ${GMAIL_REALTIME_SAFETY_SYNC_INTERVAL:5m}
      realtime-safety-sync-initial-delay: ${GMAIL_REALTIME_SAFETY_SYNC_INITIAL_DELAY:2m}
      realtime-recovery-days: ${GMAIL_REALTIME_RECOVERY_DAYS:30}
      realtime-recovery-max-messages: ${GMAIL_REALTIME_RECOVERY_MAX_MESSAGES:1000}
    imap-smtp:
      enabled: ${IMAP_SMTP_ENABLED:true}
      connect-timeout: ${IMAP_SMTP_CONNECT_TIMEOUT:10s}
      read-timeout: ${IMAP_SMTP_READ_TIMEOUT:20s}
      write-timeout: ${IMAP_SMTP_WRITE_TIMEOUT:20s}
      incremental-poll-interval: ${IMAP_SMTP_INCREMENTAL_POLL_INTERVAL:1m}
      incremental-initial-delay: ${IMAP_SMTP_INCREMENTAL_INITIAL_DELAY:1m}
      incremental-max-messages-per-folder: ${IMAP_SMTP_INCREMENTAL_MAX_MESSAGES_PER_FOLDER:250}
      incremental-max-attempts: ${IMAP_SMTP_INCREMENTAL_MAX_ATTEMPTS:12}
      sync-max-messages: ${IMAP_SMTP_SYNC_MAX_MESSAGES:10000}
      sync-max-range-days: ${IMAP_SMTP_SYNC_MAX_RANGE_DAYS:366}
      worker-concurrency: ${IMAP_SMTP_WORKER_CONCURRENCY:4}
      worker-poll-interval-ms: ${IMAP_SMTP_WORKER_POLL_INTERVAL_MS:500}
      stale-job-after: ${IMAP_SMTP_STALE_JOB_AFTER:10m}
    microsoft:
      enabled: ${MICROSOFT_OAUTH_ENABLED:false}
      tenant: ${MICROSOFT_OAUTH_TENANT:common}
      client-id: ${MICROSOFT_OAUTH_CLIENT_ID:}
      client-secret: ${MICROSOFT_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${MICROSOFT_OAUTH_REDIRECT_URI:https://messaging.renukaprasad.in/api/v1/oauth/microsoft/callback}
      frontend-base-url: ${APP_FRONTEND_BASE_URL:https://messaging.renukaprasad.in}
      webhook-notification-url: ${MICROSOFT_WEBHOOK_NOTIFICATION_URL:https://messaging.renukaprasad.in/api/v1/webhooks/microsoft}
      scope: ${MICROSOFT_OAUTH_SCOPE:openid profile email offline_access User.Read Mail.ReadWrite Mail.Send}
      oauth-state-ttl: ${MICROSOFT_OAUTH_STATE_TTL:10m}
      token-refresh-skew: ${MICROSOFT_OAUTH_TOKEN_REFRESH_SKEW:2m}
      live-initial-lookback: ${MICROSOFT_LIVE_INITIAL_LOOKBACK:5m}
      backfill-max-messages: ${MICROSOFT_BACKFILL_MAX_MESSAGES:10000}
      backfill-max-range-days: ${MICROSOFT_BACKFILL_MAX_RANGE_DAYS:365}
      backfill-worker-concurrency: ${MICROSOFT_BACKFILL_WORKER_CONCURRENCY:4}
      backfill-poll-interval-ms: ${MICROSOFT_BACKFILL_POLL_INTERVAL_MS:500}
      backfill-max-attempts: ${MICROSOFT_BACKFILL_MAX_ATTEMPTS:12}
      subscription-lifetime: ${MICROSOFT_SUBSCRIPTION_LIFETIME:PT167H}
      subscription-renew-before: ${MICROSOFT_SUBSCRIPTION_RENEW_BEFORE:24h}
      subscription-renew-interval: ${MICROSOFT_SUBSCRIPTION_RENEW_INTERVAL:12h}
      delta-page-size: ${MICROSOFT_DELTA_PAGE_SIZE:50}
      worker-concurrency: ${MICROSOFT_WORKER_CONCURRENCY:8}
      worker-poll-interval-ms: ${MICROSOFT_WORKER_POLL_INTERVAL_MS:500}
      safety-sync-interval: ${MICROSOFT_SAFETY_SYNC_INTERVAL:5m}
      safety-sync-initial-delay: ${MICROSOFT_SAFETY_SYNC_INITIAL_DELAY:2m}
      api-retry-max-attempts: ${MICROSOFT_API_RETRY_MAX_ATTEMPTS:4}
      api-retry-initial-backoff: ${MICROSOFT_API_RETRY_INITIAL_BACKOFF:1s}
      api-retry-max-backoff: ${MICROSOFT_API_RETRY_MAX_BACKOFF:30s}
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:messaging}
    ttl:
      otp: ${REDIS_TTL_OTP:5m}
      otp-attempts: ${REDIS_TTL_OTP_ATTEMPTS:10m}
      login-attempts: ${REDIS_TTL_LOGIN_ATTEMPTS:15m}
      idempotency: ${REDIS_TTL_IDEMPOTENCY:24h}
      short-cache: ${REDIS_TTL_SHORT_CACHE:5m}
      configuration-cache: ${REDIS_TTL_CONFIGURATION_CACHE:30m}
      broadcast-progress: ${REDIS_TTL_BROADCAST_PROGRESS:7d}
  notification:
    async: ${APP_NOTIFICATION_ASYNC:true}
    email:
      from: ${SMTP_FROM:${SMTP_USERNAME:}}
  invitation:
    frontend-base-url: ${APP_FRONTEND_BASE_URL:https://messaging.renukaprasad.in}
    expiry: ${APP_INVITATION_EXPIRY:72h}
  storage:
    reconciliation:
      cron: ${STORAGE_RECONCILIATION_CRON:0 30 3 * * *}
      zone: ${STORAGE_RECONCILIATION_ZONE:UTC}
      batch-size: ${STORAGE_RECONCILIATION_BATCH_SIZE:100}
  media:
    cleanup:
      initial-delay: ${MEDIA_PENDING_CLEANUP_INITIAL_DELAY:1m}
      interval: ${MEDIA_PENDING_CLEANUP_INTERVAL:12h}
    storage:
      default-provider: ${MEDIA_STORAGE_DEFAULT_PROVIDER}
      upload-url-expiry: ${MEDIA_UPLOAD_URL_EXPIRY}
      download-url-expiry: ${MEDIA_DOWNLOAD_URL_EXPIRY}
      http-connect-timeout: ${MEDIA_STORAGE_HTTP_CONNECT_TIMEOUT:3s}
      http-read-timeout: ${MEDIA_STORAGE_HTTP_READ_TIMEOUT:5s}
      supabase:
        base-url: ${SUPABASE_URL}
        service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
        bucket: ${SUPABASE_MEDIA_BUCKET}
    validation:
      image-max-size: ${MEDIA_IMAGE_MAX_SIZE}
      document-max-size: ${MEDIA_DOCUMENT_MAX_SIZE}
      video-max-size: ${MEDIA_VIDEO_MAX_SIZE}
      audio-max-size: ${MEDIA_AUDIO_MAX_SIZE}
      other-max-size: ${MEDIA_OTHER_MAX_SIZE}
      pending-ttl: ${MEDIA_PENDING_TTL}
      allowed-mime-types: ${MEDIA_ALLOWED_MIME_TYPES}
  kafka:
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl-mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl-jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}
    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:4}
      initial-delay: ${KAFKA_RETRY_INITIAL_DELAY:5s}
      multiplier: ${KAFKA_RETRY_MULTIPLIER:2}
      max-delay: ${KAFKA_RETRY_MAX_DELAY:2m}
    idempotency:
      ttl: ${KAFKA_IDEMPOTENCY_TTL:7d}
    topics:
      replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
      min-insync-replicas: ${KAFKA_MIN_INSYNC_REPLICAS:1}
      dlt-retention: ${KAFKA_DLT_RETENTION:14d}
      critical:
        name: ${KAFKA_CRITICAL_TOPIC:messaging.jobs.critical}
        retry-name: ${KAFKA_CRITICAL_RETRY_TOPIC:messaging.jobs.critical.retry}
        dlt-name: ${KAFKA_CRITICAL_DLT_TOPIC:messaging.jobs.critical.dlt}
        partitions: ${KAFKA_CRITICAL_PARTITIONS:12}
        concurrency: ${KAFKA_CRITICAL_CONCURRENCY:6}
        max-poll-records: ${KAFKA_CRITICAL_MAX_POLL_RECORDS:10}
        retention: ${KAFKA_CRITICAL_RETENTION:3d}
        consumer-group: ${KAFKA_CRITICAL_CONSUMER_GROUP:messaging-critical-workers}
      high:
        name: ${KAFKA_HIGH_TOPIC:messaging.jobs.high}
        retry-name: ${KAFKA_HIGH_RETRY_TOPIC:messaging.jobs.high.retry}
        dlt-name: ${KAFKA_HIGH_DLT_TOPIC:messaging.jobs.high.dlt}
        partitions: ${KAFKA_HIGH_PARTITIONS:12}
        concurrency: ${KAFKA_HIGH_CONCURRENCY:6}
        max-poll-records: ${KAFKA_HIGH_MAX_POLL_RECORDS:25}
        retention: ${KAFKA_HIGH_RETENTION:5d}
        consumer-group: ${KAFKA_HIGH_CONSUMER_GROUP:messaging-high-workers}
      medium:
        name: ${KAFKA_MEDIUM_TOPIC:messaging.jobs.medium}
        retry-name: ${KAFKA_MEDIUM_RETRY_TOPIC:messaging.jobs.medium.retry}
        dlt-name: ${KAFKA_MEDIUM_DLT_TOPIC:messaging.jobs.medium.dlt}
        partitions: ${KAFKA_MEDIUM_PARTITIONS:12}
        concurrency: ${KAFKA_MEDIUM_CONCURRENCY:6}
        max-poll-records: ${KAFKA_MEDIUM_MAX_POLL_RECORDS:50}
        retention: ${KAFKA_MEDIUM_RETENTION:5d}
        consumer-group: ${KAFKA_MEDIUM_CONSUMER_GROUP:messaging-medium-workers}
      low:
        name: ${KAFKA_LOW_TOPIC:messaging.jobs.low}
        retry-name: ${KAFKA_LOW_RETRY_TOPIC:messaging.jobs.low.retry}
        dlt-name: ${KAFKA_LOW_DLT_TOPIC:messaging.jobs.low.dlt}
        partitions: ${KAFKA_LOW_PARTITIONS:6}
        concurrency: ${KAFKA_LOW_CONCURRENCY:2}
        max-poll-records: ${KAFKA_LOW_MAX_POLL_RECORDS:100}
        retention: ${KAFKA_LOW_RETENTION:7d}
        consumer-group: ${KAFKA_LOW_CONSUMER_GROUP:messaging-low-workers}

server:
  tomcat:
    threads:
      max: 25
      min-spare: 2
    max-connections: 200
    accept-count: 50

logging:
  level:
    root: INFO
    org.springframework.web: INFO
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  