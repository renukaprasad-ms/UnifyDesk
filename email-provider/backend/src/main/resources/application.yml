spring:
  application:
    name: email-provider
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5003/email_provider}
    username: ${SPRING_DATASOURCE_USERNAME:email_provider}
    password: ${SPRING_DATASOURCE_PASSWORD:email_provider}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${EMAIL_PROVIDER_REDIS_HOST:localhost}
      port: ${EMAIL_PROVIDER_REDIS_PORT:6379}
      password: ${EMAIL_PROVIDER_REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5003/email_provider}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:email_provider}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:email_provider}}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9001}
    client-id: ${KAFKA_CLIENT_ID:email-provider}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:email-provider-delivery}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    admin:
      fail-fast: false

server:
  port: ${EMAIL_PROVIDER_PORT:8010}
  shutdown: graceful

app:
  mail:
    outbound:
      enabled: ${EMAIL_MAIL_OUTBOUND_ENABLED:false}
      interval-ms: ${EMAIL_MAIL_OUTBOUND_INTERVAL_MS:5000}
      smtp-host: ${EMAIL_MAIL_OUTBOUND_SMTP_HOST:}
      smtp-port: ${EMAIL_MAIL_OUTBOUND_SMTP_PORT:0}
      ehlo-host: ${EMAIL_MAIL_OUTBOUND_EHLO_HOST:}
    compose:
      enabled: ${EMAIL_MAIL_COMPOSE_ENABLED:false}
      submission-enabled: ${EMAIL_MAIL_SUBMISSION_ENABLED:false}
    activation:
      enabled: ${EMAIL_MAIL_ACTIVATION_ENABLED:false}
    scanner:
      enabled: ${EMAIL_MAIL_SCANNER_ENABLED:false}
      clamd-host: ${EMAIL_MAIL_CLAMD_HOST:127.0.0.1}
      clamd-port: ${EMAIL_MAIL_CLAMD_PORT:3310}
      rspamd-url: ${EMAIL_MAIL_RSPAMD_URL:http://127.0.0.1:11333/checkv2}
      interval-ms: ${EMAIL_MAIL_SCAN_INTERVAL_MS:5000}
    inbound:
      enabled: ${EMAIL_MAIL_INBOUND_ENABLED:false}
      spool-path: ${EMAIL_MAIL_INBOUND_SPOOL_PATH:}
      max-bytes: ${EMAIL_MAIL_INBOUND_MAX_BYTES:10485760}
  product:
    unsubscribe:
      signing-key: ${EMAIL_PROVIDER_UNSUBSCRIBE_SIGNING_KEY:}
      public-base-url: ${EMAIL_PROVIDER_PUBLIC_BASE_URL:https://api.email.unifydesk.in}
    webhooks:
      enabled: ${EMAIL_PROVIDER_PRODUCT_WEBHOOKS_ENABLED:false}
      allowed-hosts: ${EMAIL_PROVIDER_WEBHOOK_ALLOWED_HOSTS:}
      dispatch-interval-ms: ${EMAIL_PROVIDER_WEBHOOK_INTERVAL_MS:10000}
    quotas:
      project-daily: ${EMAIL_PROVIDER_PRODUCT_PROJECT_DAILY_QUOTA:1000}
      platform-daily: ${EMAIL_PROVIDER_PRODUCT_PLATFORM_DAILY_QUOTA:10000}
  security:
    api:
      internal-token: ${EMAIL_PROVIDER_INTERNAL_API_TOKEN:}
    credentials:
      master-key: ${EMAIL_PROVIDER_MASTER_KEY:}
  dkim:
    selector: ${EMAIL_PROVIDER_DKIM_SELECTOR:rly1}
  kafka:
    enabled: ${EMAIL_PROVIDER_KAFKA_ENABLED:false}
    partitions: ${EMAIL_PROVIDER_KAFKA_PARTITIONS:6}
    replication-factor: ${EMAIL_PROVIDER_KAFKA_REPLICATION_FACTOR:1}
    topics:
      delivery-requested: ${EMAIL_PROVIDER_DELIVERY_TOPIC:email.delivery.requested}
      lifecycle: ${EMAIL_PROVIDER_LIFECYCLE_TOPIC:email.lifecycle.events}
      validation-batch: ${EMAIL_PROVIDER_VALIDATION_BATCH_TOPIC:email.validation.batch}
      validation-lifecycle: ${EMAIL_PROVIDER_VALIDATION_LIFECYCLE_TOPIC:email.validation.lifecycle}
  outbox:
    batch-size: ${EMAIL_PROVIDER_OUTBOX_BATCH_SIZE:50}
    poll-interval-ms: ${EMAIL_PROVIDER_OUTBOX_POLL_INTERVAL_MS:250}
    stale-after-seconds: ${EMAIL_PROVIDER_OUTBOX_STALE_AFTER_SECONDS:120}
    max-attempts: ${EMAIL_PROVIDER_OUTBOX_MAX_ATTEMPTS:20}
  delivery:
    rate:
      platform-per-second: ${EMAIL_PROVIDER_RATE_PLATFORM_PER_SECOND:10}
      company-per-second: ${EMAIL_PROVIDER_RATE_COMPANY_PER_SECOND:2}
      domain-per-second: ${EMAIL_PROVIDER_RATE_DOMAIN_PER_SECOND:2}
    enabled: ${EMAIL_PROVIDER_DELIVERY_ENABLED:false}
    max-recipients-per-message: ${EMAIL_PROVIDER_MAX_RECIPIENTS:100}
    max-body-bytes: ${EMAIL_PROVIDER_MAX_BODY_BYTES:5242880}
    processing-stale-after-seconds: ${EMAIL_PROVIDER_PROCESSING_STALE_AFTER_SECONDS:300}
    retry:
      poll-interval-ms: ${EMAIL_PROVIDER_RETRY_POLL_INTERVAL_MS:1000}
      max-attempts: ${EMAIL_PROVIDER_DELIVERY_MAX_ATTEMPTS:8}
      initial-seconds: ${EMAIL_PROVIDER_RETRY_INITIAL_SECONDS:60}
      max-seconds: ${EMAIL_PROVIDER_RETRY_MAX_SECONDS:3600}
  validation:
    enabled: ${EMAIL_PROVIDER_VALIDATION_ENABLED:false}
    batch-size: ${EMAIL_PROVIDER_VALIDATION_BATCH_SIZE:100}
    kafka-group: ${EMAIL_PROVIDER_VALIDATION_KAFKA_GROUP:email-validator}
    cache:
      email-ttl-seconds: ${EMAIL_PROVIDER_VALIDATION_EMAIL_CACHE_TTL_SECONDS:86400}
      domain-ttl-seconds: ${EMAIL_PROVIDER_VALIDATION_DOMAIN_CACHE_TTL_SECONDS:21600}
    retry:
      poll-interval-ms: ${EMAIL_PROVIDER_VALIDATION_RETRY_POLL_INTERVAL_MS:5000}
      max-attempts: ${EMAIL_PROVIDER_VALIDATION_MAX_ATTEMPTS:4}
    smtp:
      enabled: ${EMAIL_PROVIDER_VALIDATION_SMTP_ENABLED:false}
      catch-all-enabled: ${EMAIL_PROVIDER_VALIDATION_CATCH_ALL_ENABLED:true}
      ehlo-host: ${EMAIL_PROVIDER_VALIDATION_EHLO_HOST:validator.local}
      mail-from: ${EMAIL_PROVIDER_VALIDATION_MAIL_FROM:}
      connect-timeout-ms: ${EMAIL_PROVIDER_VALIDATION_SMTP_CONNECT_TIMEOUT_MS:4000}
      read-timeout-ms: ${EMAIL_PROVIDER_VALIDATION_SMTP_READ_TIMEOUT_MS:6000}
      probes-per-domain-per-minute: ${EMAIL_PROVIDER_VALIDATION_PROBES_PER_DOMAIN_PER_MINUTE:20}
      per-domain-concurrency: ${EMAIL_PROVIDER_VALIDATION_PER_DOMAIN_CONCURRENCY:2}
      concurrency-lease-seconds: ${EMAIL_PROVIDER_VALIDATION_CONCURRENCY_LEASE_SECONDS:20}
  smtp:
    host: ${EMAIL_PROVIDER_SMTP_HOST:127.0.0.1}
    port: ${EMAIL_PROVIDER_SMTP_PORT:25}
    connect-timeout-ms: ${EMAIL_PROVIDER_SMTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${EMAIL_PROVIDER_SMTP_READ_TIMEOUT_MS:10000}
    ehlo-host: ${EMAIL_PROVIDER_SMTP_EHLO_HOST:localhost}
    envelope-from-domain: ${EMAIL_PROVIDER_ENVELOPE_FROM_DOMAIN:}
  feedback:
    enabled: ${EMAIL_PROVIDER_FEEDBACK_ENABLED:false}
    token: ${EMAIL_PROVIDER_FEEDBACK_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: email-provider
    description: First-party outbound email delivery service for Messaging

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
  level:
    root: INFO
    com.messaging.emailprovider: INFO
