services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${EMAIL_PROVIDER_DB_NAME:-email_provider}
      POSTGRES_USER: ${EMAIL_PROVIDER_DB_USER:-email_provider}
      POSTGRES_PASSWORD: ${EMAIL_PROVIDER_DB_PASSWORD:-email_provider}
    ports:
      - "${EMAIL_PROVIDER_POSTGRES_PORT:-5003}:5432"
    volumes:
      - email-provider-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EMAIL_PROVIDER_DB_USER:-email_provider} -d ${EMAIL_PROVIDER_DB_NAME:-email_provider}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  email-provider-postgres-data:
