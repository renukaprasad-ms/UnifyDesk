apiVersion: v1
kind: Service
metadata:
  name: email-postgres
  namespace: email-platform
  labels:
    app: email-postgres
spec:
  clusterIP: None
  selector:
    app: email-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: email-postgres
  namespace: email-platform
spec:
  serviceName: email-postgres
  replicas: 1
  selector:
    matchLabels:
      app: email-postgres
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: email-postgres
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - max_connections=40
            - -c
            - shared_buffers=96MB
            - -c
            - effective_cache_size=192MB
            - -c
            - maintenance_work_mem=24MB
            - -c
            - work_mem=2MB
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: email-provider-env
                  key: EMAIL_PROVIDER_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: email-provider-env
                  key: SPRING_DATASOURCE_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email-provider-env
                  key: SPRING_DATASOURCE_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 320Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
