<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UnifyDesk Email Console</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#142b4a;background:#f4f7fc}
*{box-sizing:border-box}body{margin:0}h1,h2{letter-spacing:-.04em}p{color:#6b7b92}
button,input,select{font:inherit;padding:11px 14px;border-radius:9px;border:1px solid #d9e2ef}
input,select{max-width:100%;background:#fff}button{background:#205cce;color:white;border:0;cursor:pointer;font-weight:600}
button.secondary{background:#ecf2fe;color:#2054b4}button.danger{background:#fde9e9;color:#a32f39}
form{display:grid;gap:12px}.auth{width:min(450px,94vw);margin:9vh auto;padding:34px;background:white;border:1px solid #dae4f2;border-radius:16px}
.brand{font-size:21px;font-weight:800;color:#2062d8}.hidden{display:none!important}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#102343;color:white;padding:24px 16px}aside .brand{color:white;margin-bottom:28px}
aside button{width:100%;margin:6px 0;background:transparent;text-align:left;color:#d8e8fc}
aside button.active{background:#285083}main{padding:32px;min-width:0;max-width:1450px;width:100%}
header{display:flex;justify-content:space-between;gap:12px;align-items:center}
section{background:white;border:1px solid #dce5f2;padding:24px;border-radius:15px;margin-top:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #ebf0f7}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}small{color:#6e7f97}
pre{background:#eff4fc;border-radius:8px;padding:14px;overflow-wrap:anywhere;white-space:pre-wrap}
#alert{position:fixed;right:18px;bottom:18px;background:#1a3458;color:white;padding:13px 18px;border-radius:10px}
@media(max-width:720px){.layout{grid-template-columns:1fr}aside{display:flex;gap:6px;overflow:auto;align-items:center}aside .brand{white-space:nowrap;margin:0}aside button{width:auto;white-space:nowrap}main{padding:18px}header{display:block}}
</style></head><body>
<div id="auth" class="auth"><div class="brand">✉ UnifyDesk Email</div><h1>Welcome back</h1>
<p>Independent sending, sender domains and API access.</p>
<form id="login">
<label>Organization ID <input id="org" type="number" min="1" required></label>
<label>Work email <input id="email" type="email" required></label>
<label>Password <input id="password" type="password" required></label>
<button>Sign in</button></form>
<details style="margin-top:25px"><summary>Activate an invitation</summary>
<form id="activate"><input id="invitation" placeholder="Invitation token" required>
<input id="new-password" placeholder="New password, min 12 characters" type="password" minlength="12" required>
<button>Activate</button></form></details></div>
<div id="app" class="layout hidden"><aside><div class="brand">✉ UnifyDesk Email</div>
<button data-tab="projects" class="active">Projects</button>
<button data-tab="domains">Domains</button>
<button data-tab="keys">API keys</button>
<button data-tab="webhooks">Webhooks</button>
<button data-tab="usage">Usage</button>
<button data-tab="account">Account</button></aside>
<main><header><div><h1 id="title">Projects</h1><small id="identity"></small></div>
<div class="actions"><select id="project" aria-label="Selected project"></select><button id="logout" class="secondary">Sign out</button></div></header>
<section id="content"></section></main></div>
<div id="alert" class="hidden" role="alert"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);let token=null,user=null,projects=[],chosen=null,tab="projects";
const safe=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function alertMsg(m){$("alert").textContent=m;$("alert").classList.remove("hidden");setTimeout(()=>$("alert").classList.add("hidden"),5000)}
async function api(path,method="GET",body){
 const response=await fetch("/console/v1"+path,{method,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined,credentials:"omit",cache:"no-store"});
 const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error_message||data.message||"HTTP "+response.status);return data.data;
}
$("login").onsubmit=async e=>{e.preventDefault();try{user=await api("/sessions","POST",{organizationId:Number($("org").value),email:$("email").value,password:$("password").value});token=user.sessionToken;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("identity").textContent=user.email+" · "+user.role;await load()}catch(x){alertMsg(x.message)}};
$("activate").onsubmit=async e=>{e.preventDefault();try{await api("/activate","POST",{invitationToken:$("invitation").value,password:$("new-password").value});alertMsg("Account activated. Sign in.")}catch(x){alertMsg(x.message)}};
$("logout").onclick=async()=>{try{await api("/sessions","DELETE")}catch(x){}token=null;$("app").classList.add("hidden");$("auth").classList.remove("hidden")};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
$("project").onchange=()=>{chosen=projects.find(p=>p.id===$("project").value);render()};
async function load(){try{projects=await api("/projects");chosen=projects.find(p=>p.id===chosen?.id)||projects[0]||null;$("project").innerHTML=projects.map(p=>'<option value="'+safe(p.id)+'">'+safe(p.name)+'</option>').join("");if(chosen)$("project").value=chosen.id;render()}catch(x){alertMsg(x.message)}}
function render(){
 document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 $("title").textContent={projects:"Projects",domains:"Sending domains",keys:"API keys",webhooks:"Webhooks",usage:"Usage & billing",account:"Account"}[tab];
 if(tab==="projects"){ $("content").innerHTML='<div class="row"><h2>Projects</h2><button id="create">New project</button></div>'+projects.map(p=>'<div class="row"><div><b>'+safe(p.name)+'</b><br><small>'+safe(p.id)+'</small></div><small>'+(p.sendingEnabled?"Sending enabled":"Sending disabled")+'</small></div>').join("");
 $("create").onclick=async()=>{let name=prompt("Project name");if(!name)return;try{await api("/projects","POST",{name});await load()}catch(x){alertMsg(x.message)}};return}
 if(!chosen){$("content").textContent="Create a project first.";return}
 if(tab==="domains")return domains();
 if(tab==="keys")return keys();
 if(tab==="webhooks")return webhooks();
 if(tab==="usage")return usage();
 $("content").innerHTML="<h2>Account</h2><p>"+safe(user.email)+" · "+safe(user.role)+"</p><p>Organization: "+safe(user.organizationId)+"</p><p>Project sending must be approved before use.</p>";
}
async function domains(){const id=chosen.id;$("content").innerHTML='<h2>Sending domains</h2><div class="actions"><input id="new-domain" placeholder="example.com"><button id="add-domain">Add domain</button></div><div id="domain-list"></div>';
 $("add-domain").onclick=async()=>{try{await api("/projects/"+id+"/domains","POST",{domain:$("new-domain").value});domains()}catch(x){alertMsg(x.message)}};
 try{let data=await api("/projects/"+id+"/domains");if(chosen?.id!==id)return;
 $("domain-list").innerHTML=data.map(d=>'<div class="row"><div><b>'+safe(d.domain)+'</b><p>'+safe(d.status)+'</p><pre>'+safe(JSON.stringify(d.dnsRecords,null,2))+'</pre></div><button class="secondary" data-verify="'+safe(d.id)+'">Verify DNS</button></div>').join("")||"<p>No domains created</p>";
 document.querySelectorAll("[data-verify]").forEach(b=>b.onclick=async()=>{try{await api("/projects/"+id+"/domains/"+b.dataset.verify+"/verify","POST");domains()}catch(x){alertMsg(x.message)}})
 }catch(x){alertMsg(x.message)}
}
async function keys(){const id=chosen.id;$("content").innerHTML='<h2>API keys</h2><p>Secrets are displayed once. Only embed them in secure backend environments.</p><div class="actions"><input id="key-name" placeholder="Key name"><select id="key-scope"><option value="SEND">SEND</option><option value="SEND,DOMAINS,READ">SEND + DOMAINS + READ</option><option>READ</option><option>DOMAINS</option><option>VALIDATE</option></select><button id="make-key">Create key</button></div><div id="new-key"></div><div id="keys-list"></div>';
 $("make-key").onclick=async()=>{try{const data=await api("/projects/"+id+"/keys","POST",{name:$("key-name").value,scopes:$("key-scope").value.split(",")});$("new-key").innerHTML='<h3>Copy your secret now</h3><pre id="secret"></pre><button id="copy" class="secondary">Copy</button>';$("secret").textContent=data.secret;$("copy").onclick=()=>navigator.clipboard.writeText(data.secret).then(()=>alertMsg("Copied"));showKeys(id)}catch(x){alertMsg(x.message)}};
 showKeys(id);
}
async function showKeys(id){try{const data=await api("/projects/"+id+"/keys");if(chosen?.id!==id)return;
 $("keys-list").innerHTML=data.map(k=>'<div class="row"><div><b>'+safe(k.name)+'</b><br><small>'+safe(k.prefix)+' · '+safe(k.scopes)+' · '+(k.revokedAt?"Revoked":"Active")+'</small></div>'+(k.revokedAt?'':'<button class="danger" data-revoke="'+safe(k.id)+'">Revoke</button>')+'</div>').join("")||"<p>No API keys</p>";
 document.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{if(!confirm("Revoke this key?"))return;try{await api("/projects/"+id+"/keys/"+b.dataset.revoke,"DELETE");showKeys(id)}catch(x){alertMsg(x.message)}})
 }catch(x){alertMsg(x.message)}}
async function webhooks(){
 const id=chosen.id;
 $("content").innerHTML='<h2>Signed delivery webhooks</h2><p>HTTPS destinations must be approved by the operator.</p><div class="actions"><input id="hook-url" placeholder="https://your-domain.com/mail/events" style="min-width:340px"><button id="hook-add">Create webhook</button></div><div id="hook-secret"></div><div id="hook-list"></div>';
 $("hook-add").onclick=async()=>{try{
   let data=await api("/projects/"+id+"/webhooks","POST",{url:$("hook-url").value});
   $("hook-secret").innerHTML='<p>Store this signing secret now:</p><pre id="new-hook-secret"></pre>';
   $("new-hook-secret").textContent=data.signingSecret;showWebhooks(id)
 }catch(e){alertMsg(e.message)}};showWebhooks(id);
}
async function showWebhooks(id){
 try{let data=await api("/projects/"+id+"/webhooks");if(chosen?.id!==id)return;
 $("hook-list").innerHTML=data.map(x=>'<div class="row"><div><b>'+safe(x.url)+'</b><br><small>'+(x.enabled?"Active":"Disabled")+'</small></div>'+(x.enabled?'<button class="danger" data-hook="'+safe(x.id)+'">Disable</button>':"")+'</div>').join("")||"<p>No webhooks</p>";
 document.querySelectorAll("[data-hook]").forEach(b=>b.onclick=async()=>{try{await api("/projects/"+id+"/webhooks/"+b.dataset.hook,"DELETE");showWebhooks(id)}catch(e){alertMsg(e.message)}})
 }catch(e){alertMsg(e.message)}
}
async function usage(){
 const id=chosen.id;$("content").innerHTML='<h2>Usage & billing estimate</h2><p>Postfix handoff units are billed once. Payment collection and tax invoices are not active.</p><div id="meter"></div>';
 try{let data=await api("/projects/"+id+"/usage");if(chosen?.id!==id)return;
 $("meter").innerHTML='<div class="row"><b>Accepted delivery handoffs</b><h2>'+safe(data.handedOff)+'</h2></div><div class="row"><b>Accrued INR (estimated)</b><h2>₹'+(Number(data.chargedMicroInr||0)/1000000).toFixed(4)+'</h2></div><p>UTC period: '+safe(data.from)+' – '+safe(data.to)+'</p>';
 }catch(e){alertMsg(e.message)}
}
})();
</script></body></html>
