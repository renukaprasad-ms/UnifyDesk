spring:
  application:
    name: email-provider

server:
  port: ${EMAIL_PROVIDER_PORT:8010}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: email-provider
    description: First-party outbound email delivery service for Messaging

logging:
  level:
    root: INFO
    com.messaging.emailprovider: INFO
