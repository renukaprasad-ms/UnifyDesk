name: Format Email Context

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-email-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Format email context files
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write             src/components/navigation/ChannelContextSidebar.tsx             src/features/channel/types.ts             src/pages/inbox/EmailInbox.tsx

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/navigation/ChannelContextSidebar.tsx frontend/src/features/channel/types.ts frontend/src/pages/inbox/EmailInbox.tsx
          git commit -m "[skip-email-format] style: format email account flow"
          git push origin HEAD:main
