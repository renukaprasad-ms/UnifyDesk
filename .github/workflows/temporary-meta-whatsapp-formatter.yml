name: Temporary Meta WhatsApp Formatter

on:
  push:
    branches:
      - feat/meta-whatsapp-embedded-signup

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/meta-whatsapp-embedded-signup
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: chmod +x mvnw && ./mvnw -B spotless:apply
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx prettier --write src/features/channel src/pages/company/CompanyConnections.tsx src/components/navigation/AppSidebar.tsx src/routes/AppRoutes.tsx
        working-directory: frontend
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          git commit -m "style: format Meta WhatsApp integration"
          git push origin HEAD:feat/meta-whatsapp-embedded-signup
