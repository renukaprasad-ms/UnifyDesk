name: Temporary Role Permission Formatter

on:
  push:
    branches:
      - feat/role-permission-search-select-all

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/role-permission-search-select-all
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx prettier --write src/pages/company/CompanyRoles.tsx
        working-directory: frontend
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/company/CompanyRoles.tsx
          git commit -m "style: format role permission controls"
          git push origin HEAD:feat/role-permission-search-select-all
