name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: unifydesk-app/backend/pom.xml
      - run: docker compose -f unifydesk-app/compose.test.yml up -d --wait
      - run: chmod +x mvnw && ./mvnw -B spotless:check test
        working-directory: unifydesk-app/backend
      - if: always()
        run: docker compose -f unifydesk-app/compose.test.yml down
  email-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: email-provider/pom.xml
      - run: chmod +x mvnw && ./mvnw -B spotless:check test
        working-directory: email-provider
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: unifydesk-app/frontend/package-lock.json
      - run: npm ci
        working-directory: unifydesk-app/frontend
      - run: npm test && npm run build && npm run lint && npm run format:check
        working-directory: unifydesk-app/frontend
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: unifydesk-website/package-lock.json
      - run: npm install
        working-directory: unifydesk-website
      - run: npm run build
        working-directory: unifydesk-website
