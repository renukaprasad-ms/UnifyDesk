name: Checks

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_NODE_ID: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: unifydesk-app/backend/pom.xml
      - name: Start PostgreSQL and Redis
        run: docker compose -f unifydesk-app/compose.test.yml up -d --wait
      - name: Backend Spotless
        working-directory: unifydesk-app/backend
        run: chmod +x mvnw && ./mvnw -B spotless:check
      - name: Backend clean test
        working-directory: unifydesk-app/backend
        run: ./mvnw -B clean test
      - name: Backend package
        working-directory: unifydesk-app/backend
        run: ./mvnw -B package -DskipTests
      - name: Stop PostgreSQL and Redis
        if: always()
        run: docker compose -f unifydesk-app/compose.test.yml down -v

  billing-payment-regression:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_NODE_ID: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: unifydesk-app/backend/pom.xml
      - name: Start PostgreSQL and Redis
        run: docker compose -f unifydesk-app/compose.test.yml up -d --wait
      - name: Compile and run payment / migration regression tests
        working-directory: unifydesk-app/backend
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=AutomaticRenewalServiceTests,DunningServiceTests,RecurringChargeServiceTests,RecurringAuthorizationServiceTests,RecurringAuthorizationStoreTests,PaymentCollectionServiceTests,PlatformMigrationHardeningTests test
      - name: Stop PostgreSQL and Redis
        if: always()
        run: docker compose -f unifydesk-app/compose.test.yml down -v

  database:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_NODE_ID: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: unifydesk-app/backend/pom.xml
      - name: Start PostgreSQL and Redis
        run: docker compose -f unifydesk-app/compose.test.yml up -d --wait
      - name: Current-head migration and schema validation
        working-directory: unifydesk-app/backend
        run: chmod +x mvnw && ./mvnw -B -Dtest=PlatformMigrationHardeningTests test
      - name: Stop PostgreSQL and Redis
        if: always()
        run: docker compose -f unifydesk-app/compose.test.yml down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: unifydesk-app/frontend/package-lock.json
      - name: npm ci
        working-directory: unifydesk-app/frontend
        run: npm ci
      - name: Frontend tests
        working-directory: unifydesk-app/frontend
        run: npm test
      - name: Frontend build
        working-directory: unifydesk-app/frontend
        run: npm run build
      - name: Frontend lint
        working-directory: unifydesk-app/frontend
        run: npm run lint
      - name: Frontend format check
        working-directory: unifydesk-app/frontend
        run: npm run format:check

  email-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: email-provider/backend/pom.xml
      - name: Email provider deployment smoke
        working-directory: email-provider
        run: ./tests/k8s-script-smoke.sh
      - name: Email provider Spotless
        working-directory: email-provider/backend
        run: chmod +x mvnw && ./mvnw -B spotless:check
      - name: Email provider clean test
        working-directory: email-provider/backend
        run: ./mvnw -B clean test
      - name: Email provider package
        working-directory: email-provider/backend
        run: ./mvnw -B package -DskipTests

  email-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install console dependencies
        working-directory: email-provider/frontend
        run: npm install --no-audit --no-fund
      - name: Build React console
        working-directory: email-provider/frontend
        run: npm run build


  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: unifydesk-website/package-lock.json
      - name: npm ci
        working-directory: unifydesk-website
        run: npm ci
      - name: Website build
        working-directory: unifydesk-website
        run: npm run build
      - name: Website TypeScript check
        working-directory: unifydesk-website
        run: npm run typecheck
      - name: Website static SEO audit
        working-directory: unifydesk-website
        run: npm run check:seo
