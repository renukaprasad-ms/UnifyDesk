name: Format Select Plan

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-plan-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Format select plan page
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/pages/workspace/SelectPlan.tsx

      - name: Commit formatted file
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/workspace/SelectPlan.tsx
          git commit -m "[skip-plan-format] style: format select plan page"
          git push origin HEAD:main
