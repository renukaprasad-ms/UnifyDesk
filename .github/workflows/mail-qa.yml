name: Mail QA (R1-R9)

on:
  pull_request:
    paths:
      - 'email-provider/**'
      - '.github/workflows/mail-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mail-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mail_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mail_qa"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MAIL_QA_PG_URL: jdbc:postgresql://localhost:5432/mail_qa
      MAIL_QA_PG_USER: postgres
      MAIL_QA_PG_PASSWORD: postgres
      SNOWFLAKE_NODE_ID: '0'
    defaults:
      run:
        working-directory: email-provider/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: email-provider/backend/pom.xml
      - name: Check mail formatting
        run: chmod +x mvnw && ./mvnw -B spotless:check
      - name: Compile and test (including real PostgreSQL Flyway)
        run: ./mvnw -B clean test
      - name: Package mail provider
        run: ./mvnw -B package -DskipTests

  mail-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: email-provider/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install React console dependencies
        run: npm install --no-audit --no-fund
      - name: Build shipped UI (mail hidden)
        env:
          VITE_MAIL_UI_ENABLED: 'false'
          VITE_MAIL_COMPOSE_UI_ENABLED: 'false'
          VITE_MAIL_SEND_UI_ENABLED: 'false'
        run: npm run build
      - name: Build hosted-mail preview (all UI flags)
        env:
          VITE_MAIL_UI_ENABLED: 'true'
          VITE_MAIL_COMPOSE_UI_ENABLED: 'true'
          VITE_MAIL_SEND_UI_ENABLED: 'true'
        run: npm run build
