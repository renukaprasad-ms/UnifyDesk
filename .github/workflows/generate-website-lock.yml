name: Generate website npm lockfile

on:
  push:
    branches:
      - fix/platform-ci-infrastructure-r1
    paths:
      - '.github/workflows/generate-website-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Generate npm lockfile
        working-directory: unifydesk-website
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unifydesk-website/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git commit -m "build(website): add deterministic npm lockfile"
          git push origin HEAD:"$GITHUB_REF_NAME"
