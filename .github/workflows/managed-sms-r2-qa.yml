name: Managed SMS Round 2 QA

on:
  push:
    branches:
      - review/managed-sms-security-qa-r2

jobs:
  backend-clean-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: unifydesk-app/backend/pom.xml
      - run: docker compose -f unifydesk-app/compose.test.yml up -d --wait
      - run: chmod +x mvnw && ./mvnw -B clean test
        working-directory: unifydesk-app/backend
      - if: always()
        run: docker compose -f unifydesk-app/compose.test.yml down
