name: Format Responsive Inbox Feature

on:
  push:
    branches:
      - feature/gmail-inbox-sync

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/gmail-inbox-sync
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Format backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B spotless:apply

      - name: Format frontend
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src *.ts *.json

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          git commit -m "[skip-format] style: apply responsive inbox formatters"
          git push origin HEAD:feature/gmail-inbox-sync
