name: Email Provider Remediation Helper

on:
  push:
    branches:
      - fix/platform-email-provider-remediation-r1
    paths:
      - '.github/workflows/email-provider-remediation-helper.yml'

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: email-provider/pom.xml

      - name: Apply existing Spotless formatter
        working-directory: email-provider
        run: |
          chmod +x mvnw
          ./mvnw -B spotless:apply

      - name: Guard formatter scope
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes produced."
            exit 0
          fi
          if git diff --name-only | grep -Ev '^email-provider/.*\.java$'; then
            echo "Spotless changed files outside email-provider Java sources."
            git diff --name-status
            exit 1
          fi
          git diff --check

      - name: Commit formatter-only changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'email-provider/**/*.java'
          git commit -m "style(email-provider): restore Spotless baseline"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Spotless check
        working-directory: email-provider
        run: ./mvnw -B spotless:check

      - name: Clean tests
        working-directory: email-provider
        run: ./mvnw -B clean test

      - name: Package without tests
        working-directory: email-provider
        run: ./mvnw -B package -DskipTests
