map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $messaging_forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

log_format messaging_diag
  '$remote_addr "$request" status=$status upstream_status=$upstream_status '
  'upgrade="$http_upgrade" connection="$http_connection" '
  'forwarded_proto="$http_x_forwarded_proto" request_time=$request_time '
  'upstream_time=$upstream_response_time';

access_log /var/log/nginx/access.log messaging_diag;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Meta Embedded Signup uses a cross-origin popup and postMessage.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  location /api/ {
    proxy_pass http://messaging-backend:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $messaging_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
